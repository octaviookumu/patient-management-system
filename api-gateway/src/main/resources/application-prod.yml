server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # on LocalStack the service discovery isn't 100% supported
            # so we use the docker host name + the port instead for uri values
            # and let docker decide where to send the requests
            - id: patient-service-route
              uri: http://host.docker.internal:4000
              predicates:
                - Path=/api/v1/patients/**
              filters:
                - JwtValidation

            - id: auth-service-route
              uri: http://host.docker.internal:4005
              predicates:
                - Path=/api/v1/auth/**

            - id: api-docs-patient-route
              uri: http://host.docker.internal:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs

            - id: api-docs-auth-route
              uri: http://host.docker.internal:4005
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth,/v3/api-docs


