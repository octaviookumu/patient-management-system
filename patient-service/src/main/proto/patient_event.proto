// Describes properties sent in any patient event to the topic from Kafka producer
syntax = "proto3";

// generated code will go to patient.events package
package patient.events;

// Tells Maven we want to generate individual files for each of the classes it can create
option java_multiple_files = true;

// properties in patient event
message PatientEvent{
  string patientId = 1;
  string name = 2;
  string email = 3;
  string event_type = 4;
}



