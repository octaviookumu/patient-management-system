services:
  patient-service-db:
    image: postgres:18
    ports:
      - "5001:5432"
    container_name: patient-service-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../db_volumes/patient-service-db:/var/lib/postgresql
    networks:
      - internal

networks:
  internal:
    name: internal

#  A Dockerfile tells Docker how to build an image. Your Compose file tells Docker how to run containers