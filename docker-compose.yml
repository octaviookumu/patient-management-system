services:
  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    image: patient-service:latest
    container_name: patient-service
    env_file:
      - ./patient-service/.env
    ports:
      - "4000:4000"
    networks:
      - internal
    depends_on:
      - patient-service-db
      - kafka
      - billing-service

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    image: billing-service:latest
    container_name: billing-service
    env_file:
      - ./billing-service/.env
    ports:
      - "4001:4001"
      - "9001:9001"
    networks:
      - internal

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    image: analytics-service:latest
    container_name: analytics-service
    env_file:
      - ./analytics-service/.env
    ports:
      - "4002:4002"
    networks:
      - internal
    depends_on:
      - kafka
      - patient-service

  patient-service-db:
    image: postgres:18
    ports:
      - "5001:5432"
    container_name: patient-service-db
    env_file:
      - ./patient-service/.env
    volumes:
      - ./db_volumes/patient-service-db:/var/lib/postgresql
    networks:
      - internal

  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - internal

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      - patient-service-db

networks:
  internal:
    name: internal

#  A Dockerfile tells Docker how to build an image.
#  Your Compose file tells Docker how to run containers